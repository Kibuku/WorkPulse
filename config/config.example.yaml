# WorkPulse configuration TEMPLATE.
#
# WorkPulse falls back to this template until you create config/config.yaml.
# Copy it to config/config.yaml and edit YOUR copy — not this template.
#
# This file is checked into version control. Your personal config.yaml,
# identity.yaml, and secrets.json are git-ignored and stay on your machine.

paths:
  vault: "vault"
  logs: "logs"
  reports_daily: "reports/daily"
  reports_weekly: "reports/weekly"
  prompt_daily: "config/report_prompt_daily.md"
  prompt_weekly: "config/report_prompt_weekly.md"

# Streams = the projects you want WorkPulse to track time and activity for.
# Add one entry per project. The key is the short slug used internally;
# the value is the human-readable label shown in the dashboard.
streams:
  # work-project: "My Work Project"
  # side-project: "Personal Side Project"

# Stream path patterns — first-match-wins ordering matters here.
# Each entry maps a folder name, file path fragment, or window-title
# substring to a stream. The substring is matched against the full
# normalized window title (lowercase) and any open file paths of the
# foreground process.
#
# Tip: put MORE SPECIFIC patterns FIRST. e.g. if "client-x/sub-project-y"
# should tag to sub-project-y, list sub-project-y before client-x.
#
# The dashboard's retag control adds learned patterns to
# logs/learned_tags.json as you correct untagged windows — so you don't
# need to maintain this list by hand once you've tagged a few.
watcher:
  # Watch real work locations, NOT all of ~. Watching the whole home dir
  # floods the file signal with app cache/state churn (99% noise, measured).
  # Cloud locations are discovered per platform: macOS uses CloudStorage and
  # Windows automatically adds the OneDrive folders registered for the user.
  watch_roots:
    - "~/Documents"
    - "~/Desktop"
    - "~/Downloads"
    - "~/Library/CloudStorage"   # macOS: OneDrive / SharePoint / Google Drive
    # - "D:/"                    # Windows: add other work drives as needed

  # Directory names/paths to skip entirely (never recurse into).
  ignore_dirs:
    - "Windows"
    - "Program Files"
    - "Program Files (x86)"
    - "ProgramData"
    - "$Recycle.Bin"
    - "System Volume Information"
    - ".git"
    - "__pycache__"
    - ".venv"
    - "node_modules"
    - "dist"
    - "build"
    - ".mypy_cache"
    - ".ruff_cache"
    - ".claude"
    # AppData noise — caches, telemetry, sync state
    - "AppData/Local/Temp"
    - "AppData/Local/Microsoft/Windows"
    - "AppData/Local/Google/Chrome/User Data"
    - "AppData/Local/BraveSoftware"
    - "AppData/Local/Microsoft/Edge"
    - "AppData/Local/Mozilla"
    - "AppData/Local/Packages"
    - "AppData/Roaming/npm-cache"
    - "AppData/Roaming/Code/Cache"

  # File-name glob patterns to ignore.
  ignore_patterns:
    - "*.tmp"
    - "*.tmp.*"
    - "*.temp"
    - "~$*"
    - "*.lnk"
    - "Thumbs.db"
    - "desktop.ini"
    - ".DS_Store"
    - "*.pyc"
    - "*.log"
    - "*.lock"
    - "*.exe"
    - "*.dll"
    - "ntuser.dat*"
    - "NTUSER.DAT*"

  debounce_ms: 500

  # Add your own — one entry per project pattern. Example:
  #
  # stream_path_patterns:
  #   - path: "ClientX\\ProjectY"
  #     stream: "project-y"
  #   - path: "ClientX"
  #     stream: "client-x"
  stream_path_patterns: []

# Anthropic / LLM — used by the nightly consolidation, the living profile, and
# the report engine. WorkPulse runs without these features if no API key is
# configured; set the key via the dashboard Settings page.
llm:
  # Which backend answers questions and classifies work:
  #   auto      -> hosted Claude if a key is set, else local Ollama if running, else off
  #   anthropic -> hosted Claude only
  #   ollama    -> local Ollama only (free, private, runs on your machine)
  #   none      -> no AI; deterministic/templated answers only
  backend: "auto"
  # Haiku is the economical hosted default. Move to Sonnet later only when
  # a task proves it needs stronger reasoning.
  model: "claude-haiku-4-5"           # hosted (Anthropic)
  ollama:                              # free local backend (https://ollama.com)
    url: "http://127.0.0.1:11434"
    model: "llama3.2:3b"              # pull once with:  ollama pull llama3.2:3b
    timeout_s: 35                     # then return the fast deterministic answer
  auto_tagging:
    enabled: true                     # AI is only asked when rules are ambiguous
    ambiguity_threshold: 0.75         # below this, ask the selected backend
    auto_assign_threshold: 0.85       # below this, keep deterministic/fallback result
    max_age_days: 2                   # do not reclassify old history through AI
    max_calls_per_refresh: 4          # keep the 30-minute refresh bounded
  pricing_per_million_tokens:
    input_usd: 1.00
    output_usd: 5.00

reports:
  timezone: "UTC"                     # change to your local IANA zone (e.g. America/New_York)
  daily:
    enabled: true
    schedule: "23:00"
  weekly:
    enabled: true
    schedule: "Sun 20:00"
  # Window-title substrings to redact before sending to the LLM. Use this for
  # anything you never want leaving your machine even via the LLM call —
  # banking, personal correspondents, medical, etc.
  redaction_patterns: []

# Email reporting — OFF by default. Enable from the dashboard Settings page
# after setting an SMTP app password (Gmail: https://myaccount.google.com/apppasswords).
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""           # set in Settings, or leave blank to use secrets.json
  from_addr: ""           # usually same as smtp_user
  to_addr:   ""
  send_daily: true
  send_weekly: true

# AI session logger — local-only metadata about your own Claude API usage.
ai_logger:
  store_full_prompts: false

# Storage retention. Raw evidence is useful while WorkPulse is learning, but
# should not grow forever. After this window, WorkPulse keeps durable meaning
# (captures, corrections, reports, consolidations, project attribution, and
# lightweight session/browser markers) while removing bulky reconstructable
# evidence such as file-event rows, dated JSONL sensor logs, raw titles/URLs,
# calendar details, and saved skill inputs/outputs.
retention:
  raw_days: 100

# Optional content-level coaching. OFF until the owner enables it in Settings.
# Screenshots are processed locally and deleted immediately after OCR.
content_capture:
  enabled: false
  allow_apps: ["Google Chrome", "Microsoft Word", "Excel", "PowerPoint"]
  deny_terms: ["banking", "healthcare", "payroll", "incognito"]
  redaction_terms: []

# Product feedback is local-first and only transmits after the user presses
# Send. Leave blank until your own HTTPS feedback receiver is configured.
feedback:
  endpoint_url: "https://njiani-flame.vercel.app/api/feedback"

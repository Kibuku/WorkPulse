# Fly.io config for the WorkPulse feedback inbox.
# Rename `app` to something unique before `fly launch`, then:
#   fly volumes create inbox_data --size 1
#   fly secrets set INBOX_WRITE_KEY=... INBOX_ADMIN_KEY=...
#   fly deploy
app = "workpulse-inbox"
primary_region = "iad"        # pick one near you: fly platform regions

[build]

[env]
  INBOX_DB = "/data/inbox.db"

[[mounts]]
  source = "inbox_data"       # persistent volume → survives restarts/redeploys
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0    # scale-to-zero when idle → cheapest/free

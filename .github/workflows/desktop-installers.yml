name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workpulse/**"
      - "config/config.example.yaml"
      - "pyproject.toml"
      - "installer/desktop/**"
      - ".github/workflows/desktop-installers.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: choco install innosetup tesseract -y --no-progress
      - shell: powershell
        run: .\installer\desktop\build-windows.ps1 -Flavor personal
      - name: Publish Windows pilot installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (& python -c "from workpulse import __version__; print(__version__)").Trim()
          gh release view "v$Version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$Version" --prerelease --title "Personal WorkPulse $Version pilot" --notes "Pilot release for controlled macOS and Windows testing. Installers are not yet publicly code-signed."
          }
          gh release upload "v$Version" "release-artifacts/PersonalWorkPulseSetup-$Version-Windows.exe" --clobber

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: chmod +x installer/desktop/build-macos.sh installer/desktop/macos-postinstall
      - run: ./installer/desktop/build-macos.sh personal
      - name: Publish macOS pilot installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'from workpulse import __version__; print(__version__)')"
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --prerelease \
              --title "Personal WorkPulse $VERSION pilot" \
              --notes "Pilot release for controlled macOS and Windows testing. Installers are not yet publicly code-signed."
          gh release upload "v$VERSION" \
            "release-artifacts/PersonalWorkPulse-$VERSION-macOS.pkg" --clobber
